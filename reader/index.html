<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a365d">
  <title>Actu Maison — Briefing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>📰 Actu Maison</h1>
      <p class="subtitle" id="briefing-date">Chargement…</p>
    </div>
  </header>

  <nav class="themes-bar" id="themes-bar" aria-label="Filtrer par thème">
    <button type="button" class="theme-btn active" data-theme="all">Tout</button>
  </nav>

  <main class="content" id="content">
    <p class="loading">Chargement du briefing…</p>
  </main>

  <footer class="footer">
    <button type="button" id="btn-refresh" class="btn-secondary">↻ Recharger</button>
    <span id="generated-at"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
